name: Update 4D Results

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes from 19:00-22:30 Malaysia/Singapore time
    # (11:00-14:30 UTC), every day.
    - cron: "0,30 11 * * *"
    - cron: "0,30 12 * * *"
    - cron: "0,30 13 * * *"
    - cron: "0,30 14 * * *"

permissions:
  contents: write

# Prevent two scheduled/manual runs from trying to push at the same time.
concurrency:
  group: update-4d-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update results
        run: python scripts/update_results.py

      - name: Commit updated data
        run: |
          git config user.name "4DResultHub Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          # Bring the local checkout up to date before creating the commit.
          git pull --rebase origin main

          git add data/*.json
          git commit -m "Update 4D results"

          # Push. If another remote change arrived, rebase once and retry.
          if ! git push origin main; then
            echo "Push was rejected. Updating from origin and retrying..."
            git pull --rebase origin main
            git push origin main
          fi
